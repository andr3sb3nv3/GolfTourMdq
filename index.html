<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Ryder MDQ: resultados en vivo del viaje de golf a Mar del Plata.">
<title>Ryder MDQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png" sizes="192x192">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ryder MDQ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"><div class="pantalla"><p class="vacio">Cargando…</p></div></div>
<div class="flot-viaje" id="flot-viaje">
  <div class="fv-esc" id="fv-esc" hidden></div>
  <button class="fv-test" id="fv-test" type="button" data-acc="test-toggle" aria-label="Entrar o salir del modo testeo"><span aria-hidden="true">🧪</span><b>Testeo</b></button>
  <a class="fv-btn" href="gira/" aria-label="Info del viaje: agenda, reservas, pagos y autos"><span aria-hidden="true">🧳</span><b>Info del viaje</b></a>
  <button class="fv-tab" type="button" aria-label="Mostrar los botones Testeo e Info del viaje">‹</button>
</div>
<script>
/* Botones flotantes (Testeo e Info del viaje): arrastrando cualquiera de los dos hacia
   el borde derecho (o fuera de la pantalla) quedan plegados como una flechita azul;
   tocándola vuelven a su lugar. Anda con el dedo y con el mouse. */
(function () {
  var el = document.getElementById('flot-viaje'), x0 = null, y0 = 0, dx = 0, movio = false;
  var bs = [el.querySelector('.fv-btn'), el.querySelector('.fv-test')];
  function set(p) { el.classList.toggle('plegado', p); try { localStorage.setItem('gtm-fv-plegado', p ? '1' : ''); } catch (e) {} }
  function mover(px) { bs.forEach(function (b) { b.style.transform = px ? 'translateX(' + px + 'px)' : ''; }); }
  try { if (localStorage.getItem('gtm-fv-plegado')) el.classList.add('plegado'); } catch (e) {}
  el.querySelector('.fv-tab').addEventListener('click', function () { set(false); });
  bs.forEach(function (b) {
    b.style.touchAction = 'pan-y';
    b.addEventListener('pointerdown', function (e) { x0 = e.clientX; y0 = e.clientY; dx = 0; movio = false; });
    b.addEventListener('pointermove', function (e) {
      if (x0 === null) return;
      dx = e.clientX - x0;
      if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(e.clientY - y0)) {
        movio = true;
        try { b.setPointerCapture(e.pointerId); } catch (er) {}
        mover(Math.max(0, dx));
      }
    });
    var fin = function () {
      if (x0 === null) return;
      mover(0);
      if (movio && dx > 50) set(true);
      x0 = null;
    };
    b.addEventListener('pointerup', fin);
    b.addEventListener('pointercancel', fin);
  });
  // si fue un arrastre, no cuenta como toque (ni abre el viaje ni cambia el testeo)
  el.addEventListener('click', function (e) {
    if (movio && !e.target.closest('.fv-tab')) { e.preventDefault(); e.stopPropagation(); movio = false; }
  }, true);
})();
</script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
