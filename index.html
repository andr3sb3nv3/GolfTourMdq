<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Ryder MDQ: resultados en vivo del viaje de golf a Mar del Plata.">
<title>Ryder MDQ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ryder MDQ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app"><div class="pantalla"><p class="vacio">Cargando…</p></div></div>
<div class="flot-viaje" id="flot-viaje">
  <a class="fv-btn" href="gira/" aria-label="Info del viaje: agenda, reservas, pagos y autos"><span aria-hidden="true">🧳</span><b>Info del viaje</b></a>
  <button class="fv-tab" type="button" aria-label="Mostrar el botón Info del viaje">‹</button>
</div>
<script>
/* Botón Info del viaje: siempre visible. Deslizándolo hacia el costado queda
   plegado como una flechita azul en el borde; tocándola vuelve a aparecer. */
(function () {
  var el = document.getElementById('flot-viaje'), x0 = null, y0 = 0, dx = 0;
  function set(p) { el.classList.toggle('plegado', p); try { localStorage.setItem('gtm-fv-plegado', p ? '1' : ''); } catch (e) {} }
  try { if (localStorage.getItem('gtm-fv-plegado')) el.classList.add('plegado'); } catch (e) {}
  el.querySelector('.fv-tab').addEventListener('click', function () { set(false); });
  var b = el.querySelector('.fv-btn');
  b.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; }, { passive: true });
  b.addEventListener('touchmove', function (e) {
    if (x0 === null) return;
    dx = e.touches[0].clientX - x0;
    if (Math.abs(dx) > Math.abs(e.touches[0].clientY - y0) && dx > 0) b.style.transform = 'translateX(' + dx + 'px)';
  }, { passive: true });
  b.addEventListener('touchend', function () {
    b.style.transform = '';
    if (dx > 50) set(true);
    x0 = null;
  });
  b.addEventListener('click', function (e) { if (dx > 10) { e.preventDefault(); dx = 0; } });
})();
</script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
