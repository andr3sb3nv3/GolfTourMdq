<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="../icono-192.png">
<title>Gira Amigolf 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Gira Amigolf 2026 · Mar del Plata, 27 al 29 de noviembre.">
<meta name="theme-color" content="#0A2240">
<meta property="og:title" content="Gira Amigolf 2026">
<meta property="og:description" content="Mar del Plata, 27 al 29 de noviembre. Agenda, reservas, pagos y equipos.">
<meta property="og:type" content="website">
<meta property="og:image" content="../icono-512.png">
<link rel="apple-touch-icon" href="../icono-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Mismo sistema visual que la app Ryder MDQ: barra navy, rojo USA, azul Europa, fondo claro y números negros.
   Un solo tema claro a propósito (se lee bien al sol en la cancha). */
:root{
  --navy:#0A2240; --navy-3:#1B4587;
  --usa:#C8102E; --usa-suave:#FBE7EA;
  --eur:#003DA5; --eur-suave:#E3ECFA;
  --fondo:#EDF1F7; --panel:#FFFFFF; --panel-2:#F4F7FB;
  --linea:#DCE4EE; --linea-2:#BFCCDD;
  --tinta:#0B1B2E; --tinta-2:#42566E; --tenue:#7C8CA3;
  --oro:#C8A44D; --oro-suave:#FBF3DE;
  --vivo:#16A34A; --vivo-suave:#DCF5E5; --alerta:#B45309; --alerta-suave:#FEF3C7;
  --sombra:0 1px 2px rgba(11,27,46,.06),0 6px 18px -10px rgba(11,27,46,.28);
  --titulo:Archivo,"Helvetica Neue",Arial,sans-serif;
  --texto:Karla,"Helvetica Neue",Arial,sans-serif;
  --num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--fondo);color:var(--tinta);font-family:var(--texto);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--navy)}
a{color:var(--eur)}
:focus-visible{outline:2.5px solid var(--navy-3);outline-offset:2px;border-radius:6px}
h2,h3{font-family:var(--titulo);margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
.wrap{max-width:820px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* Barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--navy);box-shadow:0 2px 10px -4px rgba(0,0,0,.4)}
.cab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px 8px}
.logo{display:flex;align-items:center;gap:9px;color:#fff;font-family:var(--titulo);text-transform:uppercase;line-height:1.05;min-width:0}
.logo img{width:40px;height:40px;flex:0 0 auto}
.logo b{display:block;font-weight:800;font-size:17px;letter-spacing:.04em}
.logo span{display:block;font-weight:600;font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.7)}
.cuenta{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);border-radius:999px;padding:6px 12px;color:#E8EEF7;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.cuenta b{font-family:var(--num);font-size:14px;color:#fff;margin-right:3px}
nav.tabs{display:flex;overflow-x:auto;scrollbar-width:none;margin-inline:-6px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;background:transparent;padding:11px 10px 12px;font:700 11.5px/1 var(--texto);letter-spacing:.04em;text-transform:uppercase;color:rgba(255,255,255,.62);white-space:nowrap;position:relative;cursor:pointer;display:flex;align-items:center;gap:5px}
nav.tabs button:hover{color:#fff}
nav.tabs button[aria-selected="true"]{color:#fff}
nav.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:#fff}
nav.tabs .n{font:600 10px/1 var(--num);background:var(--oro);color:#2B2205;border-radius:999px;padding:3px 5px}
.franja{height:4px;background:linear-gradient(90deg,var(--usa) 0 50%,var(--eur) 50% 100%)}

main{padding-block:18px 36px}
.panel{display:grid;gap:14px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--tenue)}
h2{font-size:26px;font-weight:800;line-height:1.1;margin-top:3px}
h3{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px}
.bajada{color:var(--tinta-2);font-size:15px;margin-top:4px;max-width:60ch}
.card{background:var(--panel);border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);padding:14px;min-width:0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
ul.lista{margin:0;padding-left:1.1em;display:grid;gap:5px}
.chico{font-size:14px}
.tenue{color:var(--tenue)}
.t2{color:var(--tinta-2)}

/* Chips */
.chip{display:inline-flex;align-items:center;font:700 10.5px/1 var(--texto);letter-spacing:.07em;text-transform:uppercase;padding:5px 8px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--vivo-suave);color:#11733A}
.chip.tram{background:var(--alerta-suave);color:var(--alerta)}
.chip.pend{background:var(--usa-suave);color:var(--usa)}
.chip.gris{background:var(--panel-2);color:var(--tinta-2);border:1px solid var(--linea)}
.chip.usa{background:var(--usa);color:#fff}
.chip.eur{background:var(--eur);color:#fff}

/* Tablas */
.scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
tr:last-child td{border-bottom:0}
thead th{background:var(--panel-2);font:700 10.5px/1.2 var(--texto);letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);white-space:nowrap}
table.grilla{min-width:600px}
table.grilla tbody th{font:700 10.5px/1.2 var(--texto);letter-spacing:.09em;text-transform:uppercase;color:var(--tenue);background:var(--panel-2);white-space:nowrap}
table.grilla td+td,table.grilla th+td{border-left:1px solid var(--linea)}

/* Inicio */
.dato b{display:block;font:800 30px/1 var(--titulo);letter-spacing:-.02em;color:var(--navy)}
.dato span{font-size:13px;color:var(--tinta-2)}
a.dato{text-decoration:none;color:inherit;display:grid;gap:5px}
.prox{display:grid;gap:8px}
.prox a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;color:var(--tinta);padding:8px 0;border-bottom:1px solid var(--linea)}
.prox a:last-child{border-bottom:0}
.prox a span{color:var(--tenue);font-size:13px;white-space:nowrap}

/* Agenda */
.dia{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:start}
.fecha{text-align:center;border-radius:10px;padding:8px 2px;background:var(--panel-2);border:1px solid var(--linea);font-family:var(--titulo);line-height:1}
.fecha b{display:block;font-weight:800;font-size:26px;letter-spacing:-.02em}
.fecha span{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.fecha.gira{background:var(--navy);border-color:var(--navy);color:#fff}
.fecha.gira span{color:rgba(255,255,255,.7)}
.slot{display:grid;gap:3px;padding:9px 0;border-bottom:1px dashed var(--linea-2)}
.slot:first-child{padding-top:0}
.slot:last-child{border-bottom:0;padding-bottom:0}
.slot .h{font:600 12px/1 var(--num);color:var(--tinta-2)}
.slot .t{font-weight:700;font-size:16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slot p{font-size:14px;color:var(--tinta-2)}

/* Reservas */
.cancha{display:grid;gap:10px}
.cancha .cab2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--tenue);font-weight:700;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;padding-top:3px}
.kv dd{margin:0}

/* Pagos */
.alias{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.alias code{font:600 22px/1.1 var(--num);color:var(--navy);user-select:all;overflow-wrap:anywhere}
.btn{border:0;background:var(--navy);color:#fff;font:700 12px/1 var(--texto);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:10px 16px;cursor:pointer}
.barra{height:10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--linea);overflow:hidden}
.barra i{display:block;height:100%;background:linear-gradient(90deg,var(--usa),var(--eur))}
.pt{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font:700 13px/1 var(--num)}
.pt.si{background:var(--vivo);color:#fff}
.pt.av{border:2px solid var(--vivo);color:var(--vivo)}
.pt.no{border:2px dashed var(--linea-2);color:var(--tenue)}
td.c{text-align:center;width:58px}
.ley{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--tinta-2);align-items:center}
.ley .pt{width:18px;height:18px;font-size:10px;margin-right:4px;vertical-align:middle}
@media (max-width:520px){th,td{padding:9px 7px}.apodo{display:none}}

/* Jugadores */
.equipos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.eq{border-radius:12px;padding:12px 14px;color:#fff}
.eq.usa{background:var(--usa)}
.eq.eur{background:var(--eur)}
.eq b{font:800 17px/1 var(--titulo);text-transform:uppercase;letter-spacing:.03em}
.eq ol{margin:8px 0 0;padding-left:1.2em;font-size:14px;display:grid;gap:2px}
.eq p{font-size:13px;opacity:.85;margin-top:4px}
.jug{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.jug b{font-weight:700}
.jug small{display:block;color:var(--tenue);font-size:13px}

/* Pendientes */
.tarea{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--linea);align-items:start}
.tarea:last-child{border-bottom:0}
.tarea .ck{width:20px;height:20px;border:2px solid var(--linea-2);border-radius:5px;margin-top:1px}
.tarea.hecha .ck{background:var(--vivo);border-color:var(--vivo)}
.tarea.hecha b{text-decoration:line-through;color:var(--tenue)}
.tarea .q{font-size:13px;color:var(--tenue);text-align:right}
@media (max-width:520px){.tarea{grid-template-columns:22px 1fr}.tarea .q{grid-column:2;text-align:left}}

/* Portada con el escudo */
.portada{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.portada img{width:170px;height:auto;filter:drop-shadow(0 10px 18px rgba(10,34,64,.28))}
@media (max-width:560px){.portada{grid-template-columns:1fr;justify-items:center;text-align:center}.portada img{width:210px}.portada .bajada{margin-inline:auto}}

/* Modo edición */
.lapiz{border:1px solid var(--linea-2);background:var(--panel);color:var(--navy);font:700 11px/1 var(--texto);letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.lapiz:hover{border-color:var(--navy)}
.lapiz.mas{background:var(--navy);color:#fff;border-color:var(--navy);justify-self:start}
button.pt,button.ck{cursor:pointer;padding:0;font:inherit}
button.ck{background:transparent}
.barra-ed{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--oro);color:#2B2205;font-weight:700;font-size:13px;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:10px}
.barra-ed button{border:0;background:#2B2205;color:#fff;border-radius:999px;padding:7px 12px;font:700 12px/1 var(--texto);cursor:pointer}
body.editando main{padding-bottom:70px}
.hoja{position:fixed;inset:0;z-index:60;background:rgba(11,27,46,.45);display:flex;align-items:flex-end;justify-content:center}
.hoja-in{background:var(--panel);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
@media (min-width:600px){.hoja{align-items:center}.hoja-in{border-radius:16px}}
.campos{display:grid;gap:10px}
.campos label{display:grid;gap:4px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.campos input,.campos select,.campos textarea{font:500 16px/1.3 var(--texto);color:var(--tinta);background:var(--panel-2);border:1px solid var(--linea-2);border-radius:10px;padding:10px 12px;width:100%;text-transform:none;letter-spacing:0}
.campos textarea{min-height:64px;resize:vertical}
.ed-botones{display:flex;flex-wrap:wrap;gap:8px}
.btn.sec{background:var(--panel-2);color:var(--tinta);border:1px solid var(--linea-2)}
.btn.peligro{background:var(--usa);margin-left:auto}
.ed-error{color:var(--usa);font-size:14px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--navy);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:14px;box-shadow:var(--sombra)}
.login{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.login input{font:500 16px var(--texto);border:1px solid var(--linea-2);border-radius:999px;padding:8px 14px;background:var(--panel);min-width:0;flex:1 1 160px}

.aviso{border-left:4px solid var(--oro);background:var(--oro-suave);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px}

footer{border-top:1px solid var(--linea);padding-block:18px 30px;font-size:13.5px;color:var(--tinta-2);display:grid;gap:8px}
footer h3{color:var(--tinta);font-size:13px}
.fuente{display:inline-flex;align-items:center;gap:6px}
.fuente i{width:8px;height:8px;border-radius:50%;background:var(--tenue)}
.fuente.vivo i{background:var(--vivo)}
@media (max-width:420px){h2{font-size:23px}.logo b{font-size:15px}.equipos{grid-template-columns:1fr}}
</style>

</head>

      <div class="logo"><img src="../icono-192.png" alt=""><div><b>Gira Amigolf 2026</b><span>Mar del Plata · 27 al 29 nov</span></div></div>

<footer class="wrap" id="pie"></footer>

</div>

<div id="toast" class="toast" hidden></div>

function csv(texto) {
  var filas = [], fila = [], campo = '', comillas = false;
  for (var i = 0; i < texto.length; i++) {
    var c = texto[i];
    if (comillas) {
      if (c === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else comillas = false; }
      else campo += c;
    } else if (c === '"') comillas = true;
    else if (c === ',') { fila.push(campo); campo = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && texto[i + 1] === '\n') i++; fila.push(campo); filas.push(fila); fila = []; campo = ''; }
    else campo += c;
  }
  if (campo !== '' || fila.length) { fila.push(campo); filas.push(fila); }
  return filas;
}
function aObjetos(filas) {
  var cab = (filas.shift() || []).map(function (h) { return h.trim().toLowerCase().replace(/\s+/g, '_'); });
  return filas.filter(function (f) { return f.some(function (v) { return v.trim() !== ''; }); }).map(function (f) {
    var o = {}; cab.forEach(function (h, i) { o[h] = (f[i] || '').trim(); }); return o;
  });
}
function leerPestana(nombre) {
  var url = 'https://docs.google.com/spreadsheets/d/' + PLANILLA + '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(nombre);
  return fetch(url, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); }).then(function (t) {
    var datos = aObjetos(csv(t));
    var esperadas = Object.keys(RESPALDO[nombre][0]);
    // Si la pestaña no existe, Google devuelve la primera hoja: se descarta si no trae las columnas esperadas.
    if (!datos.length || !(esperadas[0] in datos[0])) throw new Error('pestaña ' + nombre);
    return datos;
  });
}
function cargarPlanilla() {
  var tiempo = new Promise(function (_, no) { setTimeout(function () { no(new Error('tiempo')); }, 6000); });
  var lecturas = PESTANAS.map(function (p) { return leerPestana(p).catch(function () { return RESPALDO[p]; }).then(function (d) { return [p, d]; }); });
  return Promise.race([Promise.all(lecturas), tiempo]).then(function (pares) {
    var d = {}, vivas = 0;
    pares.forEach(function (x) { d[x[0]] = x[1]; if (x[1] !== RESPALDO[x[0]]) vivas++; });
    if (vivas) ORIGEN = 'planilla';
    return d;
  }).catch(function () { return RESPALDO; });
}
function cargar() {
  if (!BACKEND) return cargarPlanilla();
  var tiempo = new Promise(function (_, no) { setTimeout(function () { no(new Error('tiempo')); }, 9000); });
  var pedido = fetch(BACKEND, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok || !j.datos || !j.datos.Jugadores || !j.datos.Jugadores.length) throw new Error('backend');
    ORIGEN = 'backend'; return completar(j.datos);
  });
  return Promise.race([pedido, tiempo]).catch(cargarPlanilla);
}

    return '<div><div class="eyebrow">Dónde paramos</div><h2>Casa y noche</h2><p class="bajada">Casa de Andrés. La dirección va por el grupo.</p></div>' +
      '<div class="g2">' +
        '<div class="card"><h3>La casa</h3><ul class="lista"><li>Abre el <b>miércoles 25</b>.</li><li>Límite: <b>viernes 27, media mañana</b>.</li></ul></div>' +
        '<div class="card"><h3>Comidas</h3><ul class="lista"><li><b>Sáb:</b> almuerzo en Marayui.</li><li><b>Dom:</b> almuerzo y premios en La Catedral.</li></ul></div>' +
        '<div class="card"><h3>Sábado a la noche</h3><ul class="lista"><li>Previa en la casa.</li><li>Bruto, opcional.</li></ul></div>' +
      '</div>';
  },

  merch: function () {
    return '<div><div class="eyebrow">Green Golf · Lucas y Mateo</div><h2>Merch y premios</h2></div>' +
      '<div class="g2">' +
        '<div class="card"><h3>Ropa</h3><ul class="lista"><li>Chomba del color del equipo, con apellido.</li><li><span class="chip usa">USA</span> rojo · <span class="chip eur">Europe</span> azul.</li><li>Talles: después del draft.</li></ul></div>' +
        '<div class="card"><h3>Premios</h3><ul class="lista"><li>Campeón Stableford y equipo ganador.</li><li>Se entregan el domingo en La Catedral.</li></ul></div>' +
      '</div>';
  },

  pendientes: function () {
    var orden = D.Pendientes.slice().sort(function (a, b) { return si(a.hecho) - si(b.hecho); });
    return '<div><div class="eyebrow">Al ' + esc(cfg('actualizado')) + '</div><h2>Pendientes</h2></div>' +
      '<div class="card">' + orden.map(function (p) {
        var ck = ORIGEN === 'backend' && p._fila ? '<button type="button" class="ck" data-hecho="' + p._fila + '" aria-label="Marcar ' + esc(p.tarea) + '"></button>' : '<span class="ck" aria-hidden="true"></span>';
        return '<div class="tarea' + (si(p.hecho) ? ' hecha' : '') + '">' + ck + '<div><b>' + esc(p.tarea) + '</b>' +
          (p.detalle ? '<p class="chico t2">' + esc(p.detalle) + '</p>' : '') + '</div><div class="q">' + esc(p.responsable) + (EDIT.on ? '<div style="margin-top:6px">' + lapiz('Pendientes', p) + '</div>' : '') + '</div></div>';
      }).join('') + '</div>' + mas('Pendientes', 'Agregar pendiente');
  }
};

/* ------------------------------------------------------------------
   MODO EDICIÓN (mesa chica). Escribe en la planilla a través de BACKEND.
   ------------------------------------------------------------------ */
var EDIT = { on: false, clave: '' };
var LISTAS = {
  'Canchas.estado': ['Confirmada', 'En trámite', 'Falta reservar'],
  'Agenda.estado': ['', 'Confirmada', 'En trámite', 'Falta reservar'],
  'Jugadores.handicap': ['Activo', 'A resolver', 'Sin handicap'],
  'Jugadores.ago': ['', '✅', 'ok'], 'Jugadores.sep': ['', '✅', 'ok'], 'Jugadores.oct': ['', '✅', 'ok'],
  'Jugadores.excluido': ['', 'Sí'], 'Jugadores.capitan': ['', 'Sí'], 'Jugadores.equipo': ['', 'USA', 'Europe'],
  'Pendientes.hecho': ['', 'Sí'],
  'Pendientes.seccion': ['inicio', 'agenda', 'reservas', 'pagos', 'jugadores', 'formato', 'autos', 'casa', 'merch', 'pendientes']
};
var LARGOS = { nota: 1, detalle: 1, como: 1 };
var ETIQ = { dia: 'Día', cancha: 'Cancha', salida: 'Salida', lineas: 'Líneas', juego: 'Juego', green_fee: 'Green fee ($, solo números)', estado: 'Estado',
  gestiona: 'Gestiona', nota: 'Nota', fecha: 'Día del mes (número)', hora: 'Hora', titulo: 'Título', detalle: 'Detalle', nombre: 'Nombre', apodo: 'Apodo',
  handicap: 'Handicap', ago: 'Cuota agosto', sep: 'Cuota septiembre', oct: 'Cuota octubre', excluido: 'Excluido del pago', equipo: 'Equipo', capitan: 'Capitán',
  jugador: 'Jugador', llega: 'Llega', como: 'Cómo viaja', auto: 'Auto', tarea: 'Tarea', responsable: 'Responsable', seccion: 'Sección de la web', hecho: 'Hecho',
  inicio: 'Fecha de inicio (aaaa-mm-dd)', cuota: 'Cuota ($)', alias: 'Alias', tesorero: 'Tesorero', app: 'Link de la app' };
var BORRABLES = { Agenda: 1, Canchas: 1, Viajes: 1, Pendientes: 1 };
var TITULOS = { Agenda: 'actividad', Canchas: 'cancha', Viajes: 'viaje', Pendientes: 'pendiente', Jugadores: 'jugador' };

function columnas(tab) { return Object.keys(RESPALDO[tab][0]); }
function fila(tab, n) { return D[tab].filter(function (r) { return String(r._fila) === String(n); })[0]; }
function lapiz(tab, r) { return EDIT.on && r && r._fila ? '<button type="button" class="lapiz" data-ed="' + tab + '|' + r._fila + '">Editar</button>' : ''; }
function mas(tab, txt) { return EDIT.on ? '<button type="button" class="lapiz mas" data-nuevo="' + tab + '">+ ' + txt + '</button>' : ''; }
function aviso(msg) {
  var t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(aviso.t); aviso.t = setTimeout(function () { t.hidden = true; }, 2600);
}
function guardarClave(c) { try { if (c) localStorage.setItem('gira-clave', c); else localStorage.removeItem('gira-clave'); } catch (e) {} }
function leerClave() { try { return localStorage.getItem('gira-clave') || ''; } catch (e) { return ''; } }

function enviar(cuerpo) {
  return fetch(BACKEND, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(cuerpo) })
    .then(function (r) { return r.json(); });
}
function leerCache() { try { var c = JSON.parse(localStorage.getItem('gira-datos') || 'null'); return c && c.Jugadores && c.Jugadores.length ? completar(c) : null; } catch (e) { return null; } }
function guardarCache(d) { try { localStorage.setItem('gira-datos', JSON.stringify(d)); } catch (e) {} }
function guardar(cambios) {
  return enviar({ clave: EDIT.clave, cambios: cambios }).then(function (j) {
    if (j.ok) { D = completar(j.datos); ORIGEN = 'backend'; guardarCache(D); repintar(); aviso('Guardado en la planilla'); return true; }
    if (j.error === 'clave') {
      if (!EDIT.on) throw new Error('Esto todavía no está habilitado para todos. Avisale a Benve.');
      salirEdicion(); throw new Error('La clave cambió. Volvé a entrar en modo edición.');
    }
    if (j.error === 'la_planilla_cambio') { cargar().then(function (d) { D = d; repintar(); }); throw new Error('Alguien movió filas en la planilla. Ya recargué los datos: probá de nuevo.'); }
    throw new Error('No se pudo guardar: ' + (j.detalle || j.error || 'error'));
  }, function () { throw new Error('Sin conexión con la planilla. Probá de nuevo.'); });
}
function cambio(tab, r, datos) { return { pestana: tab, fila: r._fila, control: r[columnas(tab)[0]] || '', datos: datos }; }

var ED = null;  // { tab, r (fila existente) | null, previo }
function abrirEditor(tab, r, previo) {
  ED = { tab: tab, r: r, previo: previo || {}, borrando: false };
  var cols = tab === 'Config' ? null : columnas(tab), html = '';
  if (tab === 'Config') {
    html = D.Config.filter(function (c) { return c.clave !== 'actualizado'; }).map(function (c) {
      return '<label>' + esc(ETIQ[c.clave] || c.clave) + '<input id="ed-cfg-' + esc(c.clave) + '" data-cfg="' + c._fila + '" value="' + esc(c.valor) + '"></label>';
    }).join('');
  } else {
    html = cols.map(function (c) {
      var v = r ? (r[c] || '') : (ED.previo[c] || ''), lista = LISTAS[tab + '.' + c];
      if (tab === 'Viajes' && c === 'jugador') lista = D.Jugadores.map(function (j) { return j.nombre; });
      var campo;
      if (lista) {
        if (lista.indexOf(v) < 0) lista = [v].concat(lista);
        campo = '<select id="ed-' + c + '" name="' + c + '">' + lista.map(function (o) { return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + (o === '' ? '—' : esc(o)) + '</option>'; }).join('') + '</select>';
      } else if (LARGOS[c]) campo = '<textarea id="ed-' + c + '" name="' + c + '">' + esc(v) + '</textarea>';
      else campo = '<input id="ed-' + c + '" name="' + c + '" value="' + esc(v) + '"' + (c === 'green_fee' || c === 'fecha' ? ' inputmode="numeric"' : '') + '>';
      return '<label>' + esc(ETIQ[c] || c) + campo + '</label>';
    }).join('');
  }
  document.getElementById('ed-titulo').textContent = tab === 'Config' ? 'Datos generales' : (r ? 'Editar ' : 'Agregar ') + (TITULOS[tab] || tab.toLowerCase());
  document.getElementById('ed-campos').innerHTML = html;
  var bb = document.getElementById('ed-borrar'); bb.hidden = !(r && BORRABLES[tab]); bb.textContent = 'Borrar';
  document.getElementById('ed-error').hidden = true;
  document.getElementById('ed-guardar').disabled = false;
  document.getElementById('editor').hidden = false;
  var primero = document.querySelector('#ed-campos input, #ed-campos select, #ed-campos textarea'); if (primero) primero.focus();
}
/* Cargar el viaje propio (abierto a todos, sin clave). */
function abrirViaje(nombre) {
  var v = nombre ? D.Viajes.filter(function (x) { return x.jugador === nombre; })[0] : null;
  ED = { tab: 'Viajes', r: v || null, viaje: true, borrando: false };
  var autos = [];
  D.Viajes.forEach(function (x) { if (x.auto && autos.indexOf(x.auto) < 0) autos.push(x.auto); });
  var actual = v ? v.auto || '' : '';
  var opc = [['', 'Todavía no sé / sin auto']].concat(autos.map(function (a) { return [a, 'Voy en: ' + a]; }), [['__mio', 'Llevo mi auto']]);
  var sinViaje = D.Jugadores.filter(function (j) { return !D.Viajes.some(function (x) { return x.jugador === j.nombre; }); });
  var quien = nombre
    ? '<label>Jugador<input value="' + esc(nombre) + '" disabled><input type="hidden" id="ed-jugador" value="' + esc(nombre) + '"></label>'
    : '<label>¿Quién sos?<select id="ed-jugador">' + sinViaje.map(function (j) { return '<option value="' + esc(j.nombre) + '">' + esc(j.nombre) + (j.apodo ? ' (' + esc(j.apodo) + ')' : '') + '</option>'; }).join('') + '</select></label>';
  document.getElementById('ed-titulo').textContent = v ? 'Cambiar viaje' : 'Cargar mi viaje';
  document.getElementById('ed-campos').innerHTML = quien +
    '<label>Cuándo salís o llegás<input id="ed-llega" value="' + esc(v ? v.llega : '') + '" placeholder="Ej: Mié 25 a la mañana"></label>' +
    '<label>Auto<select id="ed-auto">' + opc.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (o[0] === actual ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select></label>' +
    '<label>Detalle<textarea id="ed-como" placeholder="Ej: salgo 8 am de Capital, me quedan 2 lugares">' + esc(v ? v.como : '') + '</textarea></label>';
  var bb = document.getElementById('ed-borrar'); bb.hidden = !(v && EDIT.on); bb.textContent = 'Borrar';
  document.getElementById('ed-error').hidden = true;
  document.getElementById('ed-guardar').disabled = !nombre && !sinViaje.length;
  if (!nombre && !sinViaje.length) errorEditor(new Error('Ya están todos cargados: tocá Cambiar en tu fila.'));
  document.getElementById('editor').hidden = false;
  var primero = document.querySelector('#ed-campos select, #ed-campos input:not([disabled]):not([type=hidden])'); if (primero) primero.focus();
}
function datosViaje() {
  var jug = document.getElementById('ed-jugador').value, auto = document.getElementById('ed-auto').value;
  if (auto === '__mio') {
    var j = D.Jugadores.filter(function (x) { return x.nombre === jug; })[0];
    auto = 'Auto de ' + (j && j.apodo ? j.apodo : apellido(jug));
  }
  return { jugador: jug, llega: document.getElementById('ed-llega').value.trim(), auto: auto, como: document.getElementById('ed-como').value.trim() };
}

function cerrarEditor() { document.getElementById('editor').hidden = true; ED = null; }
function errorEditor(e) { var p = document.getElementById('ed-error'); p.textContent = e.message; p.hidden = false; document.getElementById('ed-guardar').disabled = false; }

document.getElementById('ed-form').addEventListener('submit', function (e) {
  e.preventDefault(); if (!ED) return;
  var cambios = [];
  if (ED.tab === 'Config') {
    [].forEach.call(document.querySelectorAll('[data-cfg]'), function (inp) {
      var r = fila('Config', inp.getAttribute('data-cfg'));
      if (r && inp.value.trim() !== r.valor) cambios.push(cambio('Config', r, { valor: inp.value.trim() }));
    });
  } else if (ED.viaje) {
    var dv = datosViaje();
    if (ED.r) delete dv.jugador;
    cambios.push(ED.r ? cambio('Viajes', ED.r, dv) : { pestana: 'Viajes', nueva: true, datos: dv });
  } else {
    var datos = {};
    columnas(ED.tab).forEach(function (c) { var el = document.getElementById('ed-' + c); if (el) datos[c] = el.value.trim(); });
    if (!datos[columnas(ED.tab)[0]]) { errorEditor(new Error('Completá "' + (ETIQ[columnas(ED.tab)[0]] || columnas(ED.tab)[0]) + '".')); return; }
    cambios.push(ED.r ? cambio(ED.tab, ED.r, datos) : { pestana: ED.tab, nueva: true, datos: datos });
  }
  if (!cambios.length) { cerrarEditor(); return; }
  document.getElementById('ed-guardar').disabled = true;
  guardar(cambios).then(cerrarEditor, errorEditor);
});
document.getElementById('ed-cancelar').addEventListener('click', cerrarEditor);
document.getElementById('editor').addEventListener('click', function (e) { if (e.target.id === 'editor') cerrarEditor(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ED) cerrarEditor(); });
document.getElementById('ed-borrar').addEventListener('click', function () {
  var b = this;
  if (!ED || !ED.r) return;
  if (!ED.borrando) { ED.borrando = true; b.textContent = 'Tocá de nuevo para borrar'; return; }
  b.disabled = true;
  guardar([{ pestana: ED.tab, fila: ED.r._fila, control: ED.r[columnas(ED.tab)[0]] || '', borrar: true }])
    .then(cerrarEditor, errorEditor).then(function () { b.disabled = false; });
});

document.getElementById('main').addEventListener('click', function (e) {
  var t = e.target.closest('[data-ed],[data-nuevo],[data-pago],[data-hecho],[data-viaje]'); if (!t) return;
  if (t.hasAttribute('data-viaje')) { abrirViaje(t.getAttribute('data-viaje')); return; }
  if (!EDIT.on && !t.hasAttribute('data-hecho')) return;
  if (t.hasAttribute('data-ed')) { var x = t.getAttribute('data-ed').split('|'); abrirEditor(x[0], fila(x[0], x[1])); }
  else if (t.hasAttribute('data-nuevo')) abrirEditor(t.getAttribute('data-nuevo'), null, t.hasAttribute('data-jugador') ? { jugador: t.getAttribute('data-jugador') } : {});
  else if (t.hasAttribute('data-pago')) {
    var y = t.getAttribute('data-pago').split('|'), j = fila('Jugadores', y[0]);
    t.disabled = true;
    guardar([cambio('Jugadores', j, (function (o) { o[y[1]] = pago(j[y[1]]) === 'no' ? '✅' : ''; return o; })({}))]).catch(function (er) { aviso(er.message); t.disabled = false; });
  } else if (t.hasAttribute('data-hecho')) {
    var p = fila('Pendientes', t.getAttribute('data-hecho'));
    t.disabled = true;
    guardar([cambio('Pendientes', p, { hecho: si(p.hecho) ? '' : 'Sí' })]).catch(function (er) { aviso(er.message); t.disabled = false; });
  }
});

function entrarEdicion(clave) {
  EDIT.on = true; EDIT.clave = clave; guardarClave(clave);
  document.body.classList.add('editando'); document.getElementById('barra-ed').hidden = false;
  repintar();
}
function salirEdicion() {
  EDIT.on = false; EDIT.clave = ''; guardarClave('');
  document.body.classList.remove('editando'); document.getElementById('barra-ed').hidden = true;
  repintar();
}
document.getElementById('ed-salir').addEventListener('click', salirEdicion);
document.getElementById('pie').addEventListener('click', function (e) {
  var t = e.target.closest('button'); if (!t) return;
  if (t.id === 'pie-editar') { document.getElementById('pie-login').hidden = false; document.getElementById('pie-clave').focus(); }
  if (t.id === 'pie-config') abrirEditor('Config', null);
  if (t.id === 'pie-salir') salirEdicion();
});
document.getElementById('pie').addEventListener('submit', function (e) {
  e.preventDefault();
  var c = document.getElementById('pie-clave').value.trim(), msg = document.getElementById('pie-msg');
  if (!c) return;
  msg.textContent = 'Verificando…';
  enviar({ accion: 'probar', clave: c }).then(function (j) {
    if (j.ok) { msg.textContent = ''; entrarEdicion(c); aviso('Modo edición activado'); }
    else msg.textContent = 'Clave incorrecta.';
  }, function () { msg.textContent = 'Sin conexión con la planilla.'; });
});
function repintar() { cuenta(); pie(); mostrar(location.hash.slice(1) || 'inicio'); }

/* ------------------------------------------------------------------ */
function mostrar(id) {
  if (!V[id]) id = 'inicio';
  var k = calculos();
  var badge = { reservas: k.abiertas.length, pagos: k.deben.length, jugadores: k.sinHcp.length, pendientes: k.tareas.length };
  document.getElementById('tabs').innerHTML = TABS.map(function (t) {
    return '<button role="tab" type="button" data-tab="' + t[0] + '" aria-selected="' + (t[0] === id) + '">' + t[1] + (badge[t[0]] ? '<span class="n">' + badge[t[0]] + '</span>' : '') + '</button>';
  }).join('');
  document.getElementById('main').innerHTML = '<section class="panel" role="tabpanel">' + V[id](k) + '</section>';
  var sel = document.querySelector('nav.tabs [aria-selected="true"]');
  if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'nearest', inline: 'center' });
  var b = document.getElementById('copiar');
  if (b) b.addEventListener('click', function () {
    var listo = function () { b.textContent = 'Copiado'; setTimeout(function () { b.textContent = 'Copiar alias'; }, 1800); };
    var manual = function () { var r = document.createRange(); r.selectNodeContents(document.getElementById('alias')); var s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Copialo'; };
    try { navigator.clipboard.writeText(cfg('alias')).then(listo, manual); } catch (e) { manual(); }
  });
}
function pie() {
  var viva = ORIGEN !== 'respaldo', ed = '';
  if (BACKEND && ORIGEN === 'backend') {
    ed = EDIT.on
      ? '<p class="login"><button type="button" class="lapiz mas" id="pie-config">Editar datos generales</button><button type="button" class="lapiz" id="pie-salir">Salir de edición</button></p>' +
        '<p>Editando: tocá <b>Editar</b> en cualquier tarjeta, los círculos de Pagos para marcar una cuota o el cuadrado de un pendiente para tacharlo. Todo se guarda en la planilla al instante.</p>'
      : '<p><button type="button" class="lapiz" id="pie-editar">Editar (mesa chica)</button></p>' +
        '<form class="login" id="pie-login" hidden><input id="pie-clave" type="password" autocomplete="current-password" placeholder="Clave de la mesa chica" aria-label="Clave de la mesa chica"><button type="submit" class="btn">Entrar</button><span id="pie-msg" class="chico"></span></form>';
  }
  document.getElementById('pie').innerHTML =
    '<span class="fuente' + (viva ? ' vivo' : '') + '"><i></i>' + (viva ? 'Datos en vivo desde la planilla' : 'Datos guardados en la página') + ' · actualizado ' + esc(cfg('actualizado')) + '</span>' +
    '<h3>Cómo se actualiza</h3>' +
    '<p>Los datos salen de la planilla <b>Gira Golf Mar del Plata Organización</b>. Lo que se cambia ahí, o desde acá en modo edición, aparece para todos al recargar.</p>' + ed +
    '<p><a href="https://docs.google.com/spreadsheets/d/' + PLANILLA + '/edit" target="_blank" rel="noopener">Abrir la planilla</a></p>';
}
function cuenta() {
  var v = cfg('inicio'), m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v);
  if (m) v = m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2);
  var ini = new Date((/^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '2026-11-27') + 'T09:00:00-03:00');
  var dias = Math.ceil((ini - new Date()) / 86400000), el = document.getElementById('cuenta');
  el.innerHTML = dias > 0 ? '<b>' + dias + '</b>' + (dias === 1 ? 'día' : 'días') : dias > -3 ? 'En juego' : 'Jugada';
}

document.getElementById('tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-tab]'); if (!b) return;
  var id = b.getAttribute('data-tab');
  if (location.hash !== '#' + id) location.hash = id; else mostrar(id);
  window.scrollTo(0, 0);
});
window.addEventListener('hashchange', function () { mostrar(location.hash.slice(1)); window.scrollTo(0, 0); });

// Se pinta con lo último que se leyó de la planilla (guardado en este navegador), nunca con datos viejos del código.
// El respaldo del código solo se usa si la planilla no responde.
var previo = leerCache();
if (previo) { D = previo; ORIGEN = 'cache'; repintar(); }
else document.getElementById('main').innerHTML = '<section class="panel"><p class="bajada">Cargando la planilla…</p></section>';
cargar().then(function (d) {
  if (ORIGEN === 'respaldo') { if (!previo) { D = RESPALDO; repintar(); } return; }
  D = d; guardarCache(d);
  var c = leerClave();
  if (c && ORIGEN === 'backend') { EDIT.on = true; EDIT.clave = c; document.body.classList.add('editando'); document.getElementById('barra-ed').hidden = false; }
  repintar();
});
</script>
